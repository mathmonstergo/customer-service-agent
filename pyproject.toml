[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclops"
version = "0.1.0"
description = "Cyclops local knowledge-base and RAG operations service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.30.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "qrcode>=7.4.2",
    "pillow>=10.4.0",
    "pycryptodome>=3.20.0",
    "tiktoken>=0.7.0",
    "mcp>=1.6,<2.0",
]

[project.scripts]
cyclops = "cyclops.cli:main"

[tool.setuptools.packages.find]
include = ["cyclops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
